name: probe-runners

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-latest, macos-15, macos-14, macos-13 ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: who am i
        run: |
          uname -a
          uname -m
          sw_vers
          xcodebuild -version || true
          xcrun --sdk iphoneos --show-sdk-path || true
