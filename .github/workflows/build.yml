name: build-dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Build dylib
        run: make

      - name: Verify link graph
        run: make verify

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp SubDump.dylib out/
          lipo -info out/SubDump.dylib
          otool -l out/SubDump.dylib | grep -A3 LC_BUILD_VERSION || true
          ls -l out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubDump-dylib
          path: out/*
          if-no-files-found: error
